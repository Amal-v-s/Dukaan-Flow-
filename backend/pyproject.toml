[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dukaanflow-backend"
version = "1.0.0"
description = "Deterministic cash flow and working capital intelligence for Indian Kiranas"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.8.0",
    "python-dotenv>=1.0.0",
    "pyjwt>=2.9.0",
    "bcrypt>=4.2.0",
    "passlib[bcrypt]>=1.7.4",
    "tzdata>=2024.1",
    "httpx>=0.27.0",
    "google-cloud-firestore>=2.16.0",
]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "no_auth_override: marks tests that verify raw authentication pipeline",
]
